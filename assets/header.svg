<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%" height="200" role="img" aria-label="Oussama Chajii - Backend &amp; AI Engineer">
  <defs>
    <linearGradient id="zenitsuBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110d12"/>
      <stop offset="38%" stop-color="#2d160c"/>
      <stop offset="72%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="thunderGlow" cx="78%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.34"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#110d12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leftGlow" cx="18%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#110d12" stop-opacity="0"/>
    </radialGradient>
    <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="rounded">
      <rect width="1200" height="200" rx="16" ry="16"/>
    </clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <rect width="1200" height="200" fill="url(#zenitsuBg)"/>
    <rect width="1200" height="200" fill="url(#thunderGlow)"/>
    <rect width="1200" height="200" fill="url(#leftGlow)"/>

    <!-- Zenitsu Haori subtle geometric triangles (left & right framing) -->
    <g fill="#ffffff" fill-opacity="0.07">
      <polygon points="36,28 66,78 6,78"/>
      <polygon points="94,54 120,98 68,98"/>
      <polygon points="48,120 82,176 14,176"/>
      <polygon points="140,136 164,176 116,176"/>
      <polygon points="1136,24 1168,78 1104,78"/>
      <polygon points="1078,48 1106,96 1050,96"/>
      <polygon points="1148,118 1184,178 1112,178"/>
      <polygon points="1062,134 1088,178 1036,178"/>
    </g>

    <!-- Thunder Breathing lightning accents -->
    <g filter="url(#boltGlow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M165,30 L132,88 L174,88 L136,164 L218,74 L172,74 L206,30 Z" fill="#facc15" fill-opacity="0.22" stroke="#fde047" stroke-width="1.6" stroke-opacity="0.85"/>
      <path d="M1018,28 L982,92 L1026,92 L988,168 L1076,74 L1028,74 L1062,28 Z" fill="#facc15" fill-opacity="0.25" stroke="#fde047" stroke-width="1.6" stroke-opacity="0.9"/>
      <path d="M220,144 L310,124 L290,138 L370,118" stroke="#facc15" stroke-width="1.8" stroke-opacity="0.5"/>
      <path d="M830,118 L910,138 L890,124 L980,144" stroke="#facc15" stroke-width="1.8" stroke-opacity="0.5"/>
    </g>

    <!-- Subtle golden bottom wave -->
    <path d="M0,164 C280,194 560,136 900,166 C1040,178 1130,152 1200,164 L1200,200 L0,200 Z" fill="#ffffff" fill-opacity="0.06"/>
    <path d="M0,164 C280,194 560,136 900,166 C1040,178 1130,152 1200,164" fill="none" stroke="#facc15" stroke-width="1.4" stroke-opacity="0.5"/>

    <!-- Typography -->
    <text x="600" y="92" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="0.6">Oussama Chajii</text>
    <text x="600" y="132" text-anchor="middle" fill="#fde68a" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" letter-spacing="1.4">Backend &amp; AI Engineer</text>
  </g>
</svg>
